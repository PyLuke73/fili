[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fili"
version = "0.1.0"
description = "Replace the driver of a USB device/interface from the command line (Windows), like Zadig but scriptable"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = ["Operating System :: Microsoft :: Windows", "Environment :: Console"]

[project.scripts]
fili = "fili.cli:main"

[project.gui-scripts]
fili-gui = "fili.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
